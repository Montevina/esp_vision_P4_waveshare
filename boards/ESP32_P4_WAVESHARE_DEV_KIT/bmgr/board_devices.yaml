version: 1.0.0
devices:
  - name: camera
    type: camera
    sub_type: csi
    version: default
    init_skip: true
    config:
      csi_config:
        # Raspberry Pi style OV5647 module: free-running, no reset, no
        # power-down and no XCLK routed to the SoC.
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: false
        xclk_config:
          xclk_pin: -1
          xclk_freq_hz: 0
    peripherals:
      - name: i2c_camera
        frequency: 100000
